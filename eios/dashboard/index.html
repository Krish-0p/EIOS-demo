<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restore before the first paint, including boot and login screens.
      try { document.documentElement.classList.toggle('dark', localStorage.getItem('eios_theme') !== 'light'); } catch {}
      document.documentElement.style.colorScheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    </script>
    <title>EIOS - Enterprise Intelligent Operating System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
